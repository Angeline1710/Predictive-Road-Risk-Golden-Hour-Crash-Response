services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: rrx
      POSTGRES_PASSWORD: rrx
      POSTGRES_DB: rrx
    ports:
      - "5432:5432"
    volumes:
      - rrx_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rrx -d rrx"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.2-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: .
    environment:
      RRX_DATABASE_URL: postgresql+asyncpg://rrx:rrx@postgres:5432/rrx
      RRX_REDIS_URL: redis://redis:6379/0
      RRX_GATEWAY: simulated
      RRX_DEMO_MODE: "true"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./app:/app/app
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini

volumes:
  rrx_pgdata:
