[project]
name = "rrx-api"
version = "0.1.0"
description = "Predictive Road-Risk & Golden-Hour Crash Response -- backend API"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "pydantic==2.10.4",
    "pydantic-settings==2.7.1",
    "sqlalchemy==2.0.36",
    "geoalchemy2==0.20.0",
    "asyncpg==0.30.0",
    "alembic==1.19.1",
    "shapely==2.1.2",
    "redis==5.2.1",
    "httpx==0.28.1",
    "python-jose[cryptography]==3.3.0",
    "passlib[argon2]==1.7.4",
    "structlog==24.4.0",
    "lightgbm==4.7.0",
    "h3==4.1.2",
    "python-multipart==0.0.20",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.25.0",
    "ruff==0.8.4",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# B008: FastAPI's `Depends(...)` as an argument default is the framework's
# documented dependency-injection idiom, not the mutable-default-argument
# footgun this rule exists to catch. Standard to disable in FastAPI projects.
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# Column-per-line DDL is more reviewable against PRD.md's own DDL layout
# than a rewrapped version would be -- see the migration's own docstring.
"alembic/versions/*.py" = ["E501"]
